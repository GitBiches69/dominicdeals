services:
  - type: web
    name: dominic-deals
    runtime: node
    plan: free
    rootDir: you-know-about-the-bestbuy-deal
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: BESTBUY_API_KEY
        sync: false
